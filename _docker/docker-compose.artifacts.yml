services:
  vst-host-build:
    build:
      context: ..
      dockerfile: _docker/Dockerfile/Artifacts.dockerfile
      target: build
    image: vst-host:build
    env_file:
      - ../.env
    working_dir: /build
    volumes:
      - ${VST3_PLUGINS}:/plugins:ro
      - ${VST3_SDK}:/vst3sdk:ro
      - ../vst_builds:/build
    command:
      - /bin/bash
      - -lc
      - |
        set -Eeuo pipefail
        echo "PLUGIN=${PLUGIN}"
        echo "== Listing mounts =="
        ls -la /plugins || true
        ls -la "/plugins/${PLUGIN}" || true
        ls -la /vst3sdk || true

        test -e "/plugins/${PLUGIN}/CMakeLists.txt" || { echo "No CMakeLists.txt in /plugins/${PLUGIN}"; exit 3; }

        rm -rf "/build/${PLUGIN}"
        mkdir -p "/build/${PLUGIN}"

        cmake -S "/plugins/${PLUGIN}" -B "/build/${PLUGIN}" -G Ninja \
          -DVST_PATH=/vst3sdk \
          -DHEADLESS=ON \
          -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE:-Release} \
          -DINSTALL_TO_HOME_VST3:BOOL=OFF \
          -DUSE_SYMLINK:BOOL=OFF \
          -DSMTG_ENABLE_VSTGUI_SUPPORT:BOOL=OFF \
          -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES:BOOL=OFF \
          -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES:BOOL=OFF

        cmake --build "/build/${PLUGIN}" -j

        echo "== OUTPUT =="
        find "/build/${PLUGIN}" -maxdepth 3 -ls
